<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Subtle network grid circles -->
  <circle cx="150" cy="150" r="8" fill="#5eead4" opacity="0.6"/>
  <circle cx="362" cy="150" r="8" fill="#5eead4" opacity="0.6"/>
  <circle cx="150" cy="362" r="8" fill="#5eead4" opacity="0.6"/>
  <circle cx="362" cy="362" r="8" fill="#5eead4" opacity="0.6"/>
  <line x1="150" y1="150" x2="256" y2="256" stroke="#2dd4bf" stroke-width="2" opacity="0.3"/>
  <line x1="362" y1="150" x2="256" y2="256" stroke="#2dd4bf" stroke-width="2" opacity="0.3"/>
  <line x1="150" y1="362" x2="256" y2="256" stroke="#2dd4bf" stroke-width="2" opacity="0.3"/>
  <line x1="362" y1="362" x2="256" y2="256" stroke="#2dd4bf" stroke-width="2" opacity="0.3"/>

  <!-- Hospital & Caduceus Medical Cross -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="216" y="116" width="80" height="280" rx="20" fill="#ffffff"/>
    <!-- Horizontal Cross Bar -->
    <rect x="116" y="216" width="280" height="80" rx="20" fill="#ffffff"/>
    <!-- Center Teal Emblem -->
    <circle cx="256" cy="256" r="32" fill="#0d9488"/>
    <!-- Pulse Line in Center -->
    <path d="M 236 256 L 246 256 L 252 242 L 260 270 L 266 256 L 276 256" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
